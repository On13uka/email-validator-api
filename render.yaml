services:
  - type: web
    name: email-validator-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: HIBP_API_KEY
        sync: false  # set manually on Render dashboard
    healthCheckPath: /health
    autoDeploy: true